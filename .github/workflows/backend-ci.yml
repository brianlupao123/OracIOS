# ═══════════════════════════════════════════════════════════════
# ORAC Backend CI — Runs on changes to orac-backend/**
# ═══════════════════════════════════════════════════════════════
name: Backend CI

on:
  push:
    paths:
      - 'orac-backend/**'
    branches: [main, develop]
  pull_request:
    paths:
      - 'orac-backend/**'
    branches: [main]

defaults:
  run:
    working-directory: orac-backend

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: orac-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret
          STORE_DRIVER: json
