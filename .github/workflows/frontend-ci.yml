# ═══════════════════════════════════════════════════════════════
# ORAC Frontend CI — Runs on changes to orac-ios-frontend/**
# ═══════════════════════════════════════════════════════════════
name: Frontend CI

on:
  push:
    paths:
      - 'orac-ios-frontend/**'
    branches: [main, develop]
  pull_request:
    paths:
      - 'orac-ios-frontend/**'
    branches: [main]

defaults:
  run:
    working-directory: orac-ios-frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: orac-ios-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
